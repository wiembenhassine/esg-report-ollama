# Relecture hors pipeline — rapport de UC Berkeley, toutes les sections (6 octobre 2026).
# Corrections proposées par l'assistant Claude Code (IA) à la demande de Wiem Ben Hassine ; à valider par elle.
# Section relue phrase par phrase contre les textes STARS de Berkeley (lignes numérotées comme dans
# facts.csv). Appliqué par le code au rendu (esg/review.py) ; « apres » vide = phrase supprimée.
# Aucun chiffre tapé à la main : {{ ID }} = valeur de facts.csv.

environnement:
  - avant: "Le campus utilise une partie de l'énergie renouvelable via le programme UC Clean Power, qui inclut des sources d'électricité certifiées et non certifiées."
    apres: "Une partie de l'électricité du campus provient du programme UC Clean Power : sa part solaire est déclarée comme électricité renouvelable hors site certifiée, et sa part de grande hydraulique comme électricité renouvelable hors site non certifiée."
    raison: "Imprécis : la source distingue la part solaire (renouvelable certifiée) et la grande hydraulique (renouvelable non certifiée) du programme."
    source: "OP-5, ligne 5 : « the solar portion of UC Clean Power Program's portfolio is reported as … certified off-site renewable … the large hydro portion … uncertified »"
  - avant: "Les émissions de gaz à effet de serre sont compensées par des instruments de retraitement des émissions, issus de projets forestiers américains."
    apres: "Dans le cadre du programme Cap and Trade, des crédits de compensation sont répartis chaque année entre les campus selon leurs émissions ; cette année, les instruments de conformité retirés proviennent de projets forestiers aux États-Unis."
    raison: "Surinterprétation et contresens : les émissions ne sont pas « compensées » dans leur ensemble ; il s'agit de crédits alloués dans le marché Cap and Trade, et « retired » veut dire retirés (annulés), pas « retraitement »."
    source: "OP-6, ligne 3 : « the University allocates offsets according to the total GHG emissions under the Cap and Trade program by campus … the retired offset compliance instruments are from U.S. Forest Projects »"
  - avant: " Le campus a mis en place un système de compostage industriel."
    apres: ""
    raison: "Faux : le campus n'exploite pas de compostage industriel, il envoie ses déchets compostables vers une installation extérieure (voir Matériaux)."
    source: "OP-11, ligne 1"
  - avant: "Le campus a mis en place un système de gestion des matériaux, notamment via l'intégration de la collecte séparée des déchets."
    apres: "Le compostage est intégré à tous les circuits de collecte du campus, et les déchets compostables sont envoyés vers une installation de compostage industriel."
    raison: "« Collecte séparée » n'est pas dans la source, qui parle du compostage intégré à la collecte."
    source: "OP-11, ligne 1 : « UC Berkeley campus has integrated composting into all of our collection systems and its sent to an industrial compost facility »"
  - avant: "Le campus a mis en place un système de réduction des émissions de carbone dans la chaîne d'approvisionnement."
    apres: "Tous les appels d'offres intègrent des critères de durabilité ; l'université évalue ses fournisseurs avec EcoVadis, et ses lignes directrices d'achats durables visent notamment à réduire les émissions et les impacts carbone de la chaîne d'approvisionnement."
    raison: "Surinterprétation : la réduction des émissions de la chaîne d'approvisionnement est un objectif cité, pas un « système mis en place »."
    source: "OP-9, lignes 1, 2 et 4"
  - avant: " Le campus a mis en place des bâtiments répondant aux normes LEED-EBOM."
    apres: ""
    raison: "Mal placé : LEED-EBOM concerne l'exploitation et la maintenance des bâtiments existants (OP-2), pas leur conception (OP-1). Déplacé sous OP-2."
    source: "OP-2, ligne 3"
  - avant: "au crédit OP-2, niveau élevé."
    apres: "au crédit OP-2, niveau élevé. De nombreux bâtiments du campus respectent la norme LEED-EBOM (exploitation et maintenance des bâtiments existants), qui met l'accent sur le nettoyage écologique, les matériaux durables, la qualité de l'air et la réduction des déchets."
    raison: "Suite de la correction précédente : la phrase LEED-EBOM est placée sous le bon crédit, avec le sens donné par la source."
    source: "OP-2, ligne 3 : « Many campus buildings meet LEED-EBOM standards, which emphasize green cleaning practices … sustainable materials, improved air quality, and waste reduction »"
  - avant: "Le campus a mis en place une flotte de véhicules, dont une partie est considérée comme verte."
    apres: "Plus de {{ OP13_t0_0 }} de la flotte du campus est considérée comme verte, véhicules à carburant modulable compris ; les voiturettes électriques non immatriculées ne sont pas comptées dans la flotte."
    raison: "Formulation fausse (« a mis en place une flotte ») et information répétée plus bas ; regroupée ici avec la source."
    source: "OP-13, ligne 1 : « More than 35% of the campus fleet is considered green including our flex-fuel gasoline/E vehicles … electric carts … are not considered part of the fleet »"
  - avant: "Le campus a mis en place une flotte de véhicules, dont plus de 35 % est considérée comme verte."
    apres: ""
    raison: "Répétition de la phrase précédente (même donnée, même formulation fausse)."
    source: "OP-13, ligne 1"
  - avant: "Le campus a mis en place des modes de déplacement durables."
    apres: "La répartition des modes de déplacement provient d'une enquête annuelle sur les transports, diffusée par courriel à tout le campus ou à un échantillon représentatif."
    raison: "Phrase vide de sens et non sourcée ; la source décrit seulement l'enquête qui mesure la répartition modale."
    source: "OP-14, ligne 1 : « Every year the campus conducts a transportation survey on campus that includes determining mode split »"
  - avant: "Le campus a mis en place une évaluation de la biodiversité, notamment via le plan de gestion des feux de végétation."
    apres: "Le projet de rapport d'impact environnemental (Draft EIR) du plan de gestion de la végétation combustible des espaces naturels (Wildland Vegetative Fuel Management Plan) décrit les zones importantes pour la biodiversité."
    raison: "Imprécis : c'est le rapport d'impact environnemental du plan qui décrit les zones importantes pour la biodiversité."
    source: "IL-24, ligne 3 : « UC Berkeley's Draft Environmental Impact Report (Draft EIR) for the Wildland Vegetative Fuel Management Plan contains a description of areas of biodiversity importance »"

organisation:
  - avant: "Elle est membre de l'Université de Californie, qui regroupe plusieurs établissements dans le même périmètre d'activité."
    apres: "Elle fait partie du système de l'Université de Californie, dont le conseil des régents (Board of Regents) gouverne l'ensemble des campus."
    raison: "« Dans le même périmètre d'activité » n'a pas de sens et n'est pas sourcé : Berkeley est un campus du système UC."
    source: "PA-3, ligne 8 : « the Board of Regents governs the entire University of California system »"
  - avant: "Le périmètre d'activité de l'université de Californie, Berkeley, est défini en fonction de ses besoins opérationnels.\n\n"
    apres: ""
    raison: "Déformation : le périmètre est celui où le campus garde le contrôle opérationnel (phrase suivante), pas « ses besoins opérationnels »."
    source: "PRE-3, ligne 1 : « includes those for operational purposes the campus retains operational control »"
  - avant: "(GRI 2-3)\n\n(GRI 2-3)\n\n"
    apres: ""
    raison: "Renvois GRI isolés et répétés, sans texte (forme)."
    source: "—"
  - avant: "Ce rapport ne peut pas établir les entités incluses dans le périmètre d'activité de l'université de Californie, Berkeley, car les ratios par personne ou par m² ne sont pas comparables tels quels.\n\n(GRI 2-2)\n\n"
    apres: ""
    raison: "Contradiction : les entités du périmètre sont données plus haut (campus principal, Hill campus, Richmond Field Station, réserves), et la raison avancée ne concerne pas les entités."
    source: "PRE-3, ligne 1"

materialite:
  - avant: "L'université a adopté un plan stratégique pour la durabilité qui inclut des objectifs mesurables, tels que"
    apres: "Le Student Environmental Resource Center (SERC) de l'université a adopté un plan stratégique {{ PA2_t7_0 }}-{{ PA2_t7_1 }} qui inclut des objectifs mesurables, tels que"
    raison: "Mauvaise attribution : ce plan stratégique est celui du centre étudiant SERC, pas un plan de durabilité de l'université."
    source: "PA-2, ligne 8 : « UC Berkeley's Student Environmental Resource Center (SERC) adopted a 2017 - 2022 strategic plan »"
  - avant: "L'université suit également la politique de pratiques durables du système UC, qui inclut des objectifs tels que la réduction des émissions de gaz à effet de serre de manière à atteindre un campus à zéro carbone."
    apres: "L'université a aussi publié un plan de durabilité (Sustainability Plan), avec des objectifs pour l'énergie, l'eau, les déchets, l'alimentation durable et la biodiversité, et un plan d'action climat (Climate Action Plan). Elle suit la politique de pratiques durables (Sustainable Practices Policy) du système UC, qui demande à tous les sites UC de réduire toutes leurs émissions d'au moins {{ PA2_t8_0 }} d'ici {{ PA2_t8_1 }} et d'éliminer les émissions restantes par des crédits de captage et de stockage du carbone."
    raison: "Imprécis : le « campus zéro carbone » vient du plan de durabilité ; la politique UC fixe une baisse d'au moins 90 % de toutes les émissions d'ici 2045."
    source: "PA-2, lignes 1, 3, 9 et 10"

gouvernance:
  - avant: "plusieurs officiers de durabilité dans le Bureau de la durabilité, la Haas et le SERC"
    apres: "plusieurs responsables de la durabilité (Sustainability Officers) au Bureau de la durabilité, à Haas et au SERC"
    raison: "Faux-ami : « officer » désigne une fonction (responsable, chargé de mission), pas un « officier »."
    source: "PA-1, ligne 3 : « UC Berkeley has several Sustainability Officers in the Office of Sustainability, HAAS, and SERC »"
  - avant: "L'université de Californie à Berkeley a plusieurs organes en cours qui permettent aux membres du personnel académique de participer à la gouvernance de l'institution. Le principal organe est la division de Berkeley de l'Académie de la durabilité, qui fait partie du Sénat académique de l'université de Californie."
    apres: "L'université de Californie à Berkeley a plusieurs organes permanents qui permettent au personnel académique de participer à la gouvernance de l'institution. Le principal est la division de Berkeley du Sénat académique, qui fait partie du Sénat académique de l'ensemble du système de l'université de Californie."
    raison: "« Académie de la durabilité » est inventé : il s'agit de la division de Berkeley du Sénat académique ; « en cours » traduit mal « ongoing »."
    source: "PA-3, ligne 11 : « The primary body is the Berkeley Division of the Academic Senate »"
  - avant: "Ce rapport ne peut pas établir la structure et la composition de la gouvernance de l'université de Californie à Berkeley, en particulier les catégories GRI 2-10 à GRI 2-21, qui ne sont pas couvertes par STARS."
    apres: "Ce rapport ne peut pas établir la composition détaillée de l'organe de gouvernance (GRI 2-9), ni les publications GRI 2-10 à GRI 2-21, que STARS ne couvre pas ou seulement en partie (GRI 2-13 et GRI 2-14)."
    raison: "Contradiction : la section décrit une partie de la gouvernance (GRI 2-9 partiellement rapporté), et GRI 2-13 et 2-14 sont partiellement couverts."
    source: "Index GRI calculé par le code (esg/gri_index.py)"

strategie:
  - avant: "L'Université de Californie à Berkeley (UC Berkeley) a adopté une stratégie de développement durable qui vise à renforcer les programmes et les ressources pour approfondir l'engagement dans la communauté de la durabilité. Cette stratégie est définie dans le plan stratégique du Student Environmental Resource Center (SERC) qui inclut"
    apres: "L'Université de Californie à Berkeley (UC Berkeley) a publié un plan de durabilité (Sustainability Plan) et un plan d'action climat (Climate Action Plan). Son centre étudiant, le Student Environmental Resource Center (SERC), a adopté un plan stratégique qui vise à renforcer les programmes et les ressources pour approfondir l'engagement dans la communauté de la durabilité, et qui inclut"
    raison: "Mauvaise attribution : le plan stratégique cité est celui du SERC, pas la stratégie de durabilité de l'université, qui a son propre plan de durabilité."
    source: "PA-2, lignes 1, 3 et 8"

parties_prenantes:
  - avant: "L'université a également établi des comités consultatifs pour la gouvernance, qui impliquent des membres de la communauté locale et des étudiants. Ces comités fournissent aux organisations communautaires un forum pour donner leur avis sur les politiques et les initiatives de l'université qui affectent la population locale."
    apres: "Ces instances donnent aux organisations communautaires un forum pour donner leur avis sur les politiques et les initiatives de l'université qui touchent la population locale. Les étudiants sont représentés au CACS, où plusieurs organisations étudiantes et services ont chacun un siège et une voix, et le personnel non académique participe à la gouvernance par des comités consultatifs comme le Chancellor's Staff Advisory Committee (CSAC)."
    raison: "Confusion : les comités ouverts à la communauté locale sont ceux du paragraphe précédent ; étudiants et personnel participent par d'autres instances (CACS, CSAC)."
    source: "PA-3, lignes 1, 24 et 27"
  - avant: "le programme College Corps, qui a permis à des étudiants de la faculté de participer à des partenariats communautaires dans le domaine de la justice climatique et alimentaire."
    apres: "le programme College Corps, partenariat de l'État de Californie financé par California Volunteers, par lequel le Public Service Center a placé des étudiants de premier cycle dans des partenariats de justice climatique ou alimentaire avec des organisations locales."
    raison: "« Étudiants de la faculté » est faux : ce sont des étudiants de premier cycle placés par le Public Service Center."
    source: "EN-6, ligne 4 : « the UC Public Service Center placed … undergraduate student Fellows in Climate or Food Justice community partnerships »"

social:
  - avant: "Le salaire minimum local est de 42,8 % de la valeur actuelle. L'heure de travail doit être au moins de 42,8 % de la valeur actuelle, en tenant compte du taux de bénéfices combinés des employés."
    apres: "Le salaire décent de référence est calculé avec le calculateur du Massachusetts Institute of Technology (MIT) ; le seuil horaire retenu pour le personnel tient compte du taux composite des avantages sociaux (CBR), actuellement de {{ PA13_t1_0 }}."
    raison: "Contresens (erreur signalée) : 42,8 % est le taux composite des avantages sociaux du personnel (CBR), pas un salaire minimum ni une part d'une « valeur actuelle »."
    source: "PA-13, ligne 2 : « The campus composite benefits rate for staff members is currently 42.8% … when incorporating the 42.8% CBR »"
  - avant: "Les employés doivent satisfaire aux exigences de la politique de congé parental."
    apres: "Les employés doivent remplir les conditions de la politique de congé familial et médical (Family and Medical Leave Policy)."
    raison: "Mauvaise traduction : il s'agit du congé familial et médical (FML), pas du congé parental."
    source: "PA-12, ligne 2 : « Employees would have to meet requirements for Family and Medical Leave (FML) Policy »"
  - avant: "Le système de gestion de la santé et de la sécurité au travail n'est pas décrit."
    apres: "Le campus propose des ateliers de bien-être (série Mind-Body-Spirit) et applique une politique de campus sans fumée ni tabac, mise à jour par les services de santé universitaires (University Health Services)."
    raison: "Formulation négative à éviter, alors que la source décrit des actions de santé et de bien-être."
    source: "PA-11, lignes 2 à 4"
  - avant: " Le directeur de la diversité, de l'équité, de l'inclusion et de l'appartenance est Lasana Hotep."
    apres: ""
    raison: "Ce n'est pas un résultat : la source cite un contact (fonction et nom) ; « le directeur » suppose en plus un genre que la source ne donne pas."
    source: "PA-8, ligne 1"
  - avant: " Les initiatives de données sur l'équité sont menées par l'équipe de l'équité et de l'inclusion."
    apres: ""
    raison: "Ce n'est pas un résultat : la source indique l'origine des données (Equity Data Initiatives)."
    source: "PA-7, ligne 2"
  - avant: " La proportion de tous les étudiants de premier cycle recevant des subventions Pell pour l'année universitaire 2021 est de 2021."
    apres: " Les données viennent de l'IPEDS : part des étudiants de premier cycle bénéficiant d'une bourse Pell, pour l'année universitaire débutant en {{ PA9_t0_0 }} (la plus récente disponible)."
    raison: "Une année est présentée comme une proportion (« est de 2021 ») ; la valeur de la part n'est pas dans les données publiques."
    source: "PA-9, ligne 1 : « % of all undergraduate students receiving Pell Grants for academic year 2021-22 »"
  - avant: " Le directeur exécutif de l'Office of Planning and Analysis est Sereeta Alexander."
