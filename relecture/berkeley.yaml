# Relecture hors pipeline — rapport de University of California, Berkeley, génération du 7 octobre 2026 (branche rapport-qualite).
# Corrections proposées par l'assistant Claude Code (IA) à la demande de Wiem Ben Hassine ; à valider par elle.
# L'ancienne relecture (texte du 6 octobre) reste dans la branche main. Appliqué par le code au rendu (esg/review.py) ;
# « apres » vide = phrase supprimée. Aucun chiffre tapé à la main : {{ ID }} = valeur de facts.csv.

organisation:
  - avant: "Cette collaboration impliquait plusieurs départements du campus, chacun fournissant des informations essentielles pour un rapport complet."
    apres: "Des représentants de plusieurs services du campus, dont Facilities Services et Residential Life, y ont participé dès la planification ; l'Office de la durabilité a ensuite regroupé les données dans une base centrale et les a recoupées entre services.\n\nLe périmètre du rapport couvre les sites sur lesquels le campus exerce le contrôle opérationnel : le campus principal, le Hill campus voisin, la Richmond Field Station et d'autres stations et réserves gérées par le campus, ainsi que des bâtiments qu'il possède en divers lieux (GRI 2-2)."
    raison: "Phrase vague ; le périmètre, donné par STARS, manquait."
    source: "PRE-4, lignes 2 et 5 ; PRE-3, ligne 1"
  - avant: "ni les entités comprises dans le périmètre de l'université, "
    apres: ""
    raison: "Limite inexacte : les entités du périmètre sont décrites dans STARS (voir la correction précédente)."
    source: "PRE-3, ligne 1"

materialite:
  - avant: "L'université a adopté un plan stratégique pour la durabilité, qui inclut des objectifs mesurables pour réduire les émissions de gaz à effet de serre et atteindre une campus à zéro carbone. Ce plan est aligné avec les politiques de durabilité du système universitaire de Californie."
    apres: "L'université a publié un plan de durabilité (Sustainability Plan) qui fixe des objectifs pour l'énergie, l'eau, la réduction des déchets, l'alimentation durable et la biodiversité ; il est aligné sur les politiques de durabilité du système de l'université de Californie, avec des objectifs et un calendrier propres au campus. Son volet climat et résilience vise une transition juste et équitable vers un campus résilient, à énergie propre et zéro carbone. Le centre étudiant SERC a aussi adopté un plan stratégique ({{ PA2_t7_0 }}-{{ PA2_t7_1 }}) avec des objectifs mesurables, comme élargir l'accès aux activités d'apprentissage co-curriculaires."
    raison: "« Plan stratégique pour la durabilité » mêlait le plan de durabilité de l'université et le plan stratégique du SERC ; faute d'accord (« une campus ») ; contenu précisé d'après la source."
    source: "PA-2, lignes 3, 8 et 10"

gouvernance:
  - avant: "L'Académie du Sénat (Academic Senate) des professeurs de l'université joue un rôle dans les responsabilités de gouvernance partagées établies par les Régents (The Regents). Le Sénat est investi par le corps de gouvernance de l'université, le Conseil des Régents (Board of Regents), de la prise de décision directe sur les affaires académiques importantes pour l'université. (GRI 2-13)"
    apres: "Les enseignants-chercheurs réunis au sein du Sénat académique (Academic Senate) exercent les responsabilités de gouvernance partagée fixées par les Régents : le conseil des Régents (Board of Regents) confie au Sénat le contrôle direct des questions académiques essentielles (politique académique, conditions d'admission et de délivrance des diplômes, cours et programmes) et un rôle de conseil sur les nominations, les promotions et les budgets. (GRI 2-9)"
    raison: "« Académie du Sénat » traduit mal Academic Senate ; GRI 2-13 (délégation de la gestion des impacts) ne correspond pas : il s'agit de la structure de gouvernance (GRI 2-9)."
    source: "PA-3, ligne 17"
  - avant: "Le Conseil des Régents (Board of Regents) de l'université comprend des représentants étudiants. Bien que le Conseil des Régents gouverne le système universitaire de la Californie, il est la principale autorité sur les politiques, les finances et la planification stratégique de l'université. (GRI 2-14)"
    apres: "Le conseil des Régents, plus haute instance de décision, comprend des représentants étudiants ; il gouverne l'ensemble du système de l'université de Californie, et pas seulement le campus de Berkeley, et exerce l'autorité ultime sur les politiques, les finances et la planification stratégique de tous les campus. (GRI 2-9)"
    raison: "« Bien que… il est » inverse la logique de la source ; GRI 2-14 (rôle dans le reporting de durabilité) ne correspond pas."
    source: "PA-3, ligne 8"

strategie:
  - avant: "L'université de Californie, Berkeley, a adopté la Stratégie de Durabilité de l'Université de Californie, qui vise à réduire les émissions de gaz à effet de serre et à améliorer la durabilité de l'université. Cette stratégie est renforcée par la signature de la Déclaration de Leadership Climatique de Second Nature, qui inclut l'Engagement sur le Carbone."
    apres: "L'université a publié un plan de durabilité (Sustainability Plan), aligné sur les politiques de durabilité du système de l'université de Californie. Elle est aussi signataire des Climate Leadership Commitments de Second Nature, qui comprennent le Carbon Commitment, un engagement de réduction des émissions de carbone."
    raison: "Aucune « Stratégie de durabilité de l'université de Californie » n'est citée par les sources : c'est le plan de durabilité du campus ; noms de l'engagement de Second Nature rétablis."
    source: "PA-2, lignes 2 et 3"

parties_prenantes:
  - avant: "L'université de Californie, Berkeley, englobe plusieurs catégories fixes de parties prenantes dans son engagement, notamment les étudiants, les enseignants, le personnel et la communauté locale."
    apres: "Plusieurs groupes de parties prenantes participent à la gouvernance de l'université : les étudiants, les enseignants-chercheurs, par le Sénat académique, et des membres de la communauté locale, par des comités consultatifs sur la santé publique, la durabilité et la justice sociale (GRI 2-29)."
    raison: "« Catégories fixes » ne correspond à rien dans la source ; précisé d'après PA-3."
    source: "PA-3, lignes 2, 18 et 27"
  - avant: "L'un des initiatives clés est le Cal Civic Engagement Program, qui encourage et soutient les enseignants et le personnel à contribuer à la communauté par le biais de la solidarité et de l'engagement civique. Ce programme s'aligne sur la mission de l'université pour promouvoir la justice sociale et l'engagement civique."
    apres: "L'une des principales initiatives est le Cal Civic Engagement Program, qui encourage les enseignants et le personnel à contribuer à la communauté par le bénévolat et l'engagement civique, conformément à la mission de responsabilité sociale de l'université."
    raison: "« Solidarité » traduit mal volunteerism ; la source parle de responsabilité sociale, pas de justice sociale ; accord (« l'un des initiatives »)."
    source: "EN-5, ligne 4"
  - avant: "la discrimination anti, la protection du lanceur d'alerte et les avantages des employés"
    apres: "la lutte contre les discriminations, la protection des lanceurs d'alerte et les avantages sociaux"
    raison: "« Discrimination anti » : anti-discrimination mal traduit."
    source: "PA-12, ligne 3"

environnement:
  - avant: "L'université de Californie, Berkeley, a mis en place plusieurs initiatives pour réduire son impact environnemental. Elle a notamment investi dans un système de cogénération qui fournit de l'électricité et du chauffage pour les bâtiments du campus. Ce système a été construit en 1987 et a permis de réduire les émissions de gaz à effet de serre."
    apres: "Le système énergétique du campus repose sur une centrale de cogénération au gaz, construite en {{ OP5_t8_0 }}, principale source d'électricité et de chauffage des bâtiments ; elle produit de l'électricité et de la vapeur. Une partie de l'électricité vient du programme UC Clean Power, dont la part solaire est déclarée comme électricité renouvelable hors site certifiée (GRI 302-1)."
    raison: "« A permis de réduire les émissions » n'est pas dans la source (il s'agit d'une centrale au gaz) ; phrase d'introduction générique."
    source: "OP-5, lignes 5 et 9"
  - avant: "L'université a également mis en place un programme de réduction des émissions de gaz à effet de serre, qui consiste à acheter des crédits de carbone pour compenser les émissions non réduites. Cette année, les crédits de carbone ont été achetés auprès de projets de forêt en Amérique du Nord."
    apres: "Dans le cadre du programme de plafonnement et d'échange (Cap and Trade), l'université de Californie répartit chaque année des crédits de compensation entre ses campus selon leurs émissions ; cette année, les instruments de conformité retirés proviennent de projets forestiers aux États-Unis (GRI 305-1)."
    raison: "Ce n'est pas un programme de réduction propre à Berkeley, mais l'attribution annuelle de crédits du système Cap and Trade ; « Amérique du Nord » au lieu des États-Unis."
    source: "OP-6, ligne 3"
  - avant: "L'université a également mis en place des programmes pour réduire la consommation d'eau. Elle a notamment installé des systèmes de récupération d'eau de pluie et a mis en place des programmes de compostage."
    apres: "Le système de récupération d'eau de pluie et la noue végétalisée du Hearst Field Annex ont été créés comme projet de recherche, et Chou Hall, à la Haas School of Business, récupère et réutilise aussi l'eau de pluie (GRI 303-1)."
    raison: "Le compostage n'a rien à voir avec l'eau ; phrases génériques remplacées par les faits de la source."
    source: "OP-3, ligne 4"
  - avant: "En matière de gestion des déchets, l'université a mis en place des programmes de recyclage et de compostage. Elle a également mis en place un programme de réduction des déchets non recyclables."
    apres: "Le compostage est intégré à tous les circuits de collecte du campus, avec envoi vers une installation de compostage industriel. La vaisselle réutilisable est en place dans tous les restaurants universitaires et la plupart des points de vente, et l'université travaille à remplacer les plastiques à usage unique et compostables des repas à emporter par de la fibre ou du réutilisable (GRI 306-2)."
    raison: "Phrases génériques ; « programme de réduction des déchets non recyclables » n'est pas dans la source."
    source: "OP-11, lignes 1 et 2"
  - avant: "L'université a également mis en place des programmes pour réduire les émissions de gaz à effet de serre liées à la chaîne d'approvisionnement. Elle a notamment mis en place un système de notation des fournisseurs pour évaluer leur impact environnemental."
    apres: "Ses lignes directrices d'achats durables imposent des exigences de durabilité à {{ OP9_t2_0 }} des appels d'offres, et l'université évalue les caractéristiques de durabilité de ses fournisseurs avec EcoVadis (GRI 308-1)."
    raison: "La source ne parle pas d'un programme de réduction des émissions de la chaîne d'approvisionnement ; les fournisseurs sont évalués avec EcoVadis."
    source: "OP-9, lignes 2 et 3"
  - avant: "(GRI 101-2, GRI 101-4, GRI 101-5, GRI 302-1, GRI 302-3, GRI 303-1, GRI 303-3, GRI 305-1, GRI 305-2, GRI 305-3, GRI 305-4, GRI 305-5, GRI 306-2, GRI 306-3, GRI 306-4, GRI 306-5, GRI 308-1)"
    apres: "Plus de {{ OP13_t0_0 }} de la flotte du campus est considérée comme verte (OP-13). De nombreux bâtiments respectent la norme LEED-EBOM pour l'exploitation et la maintenance (OP-2). Tout le campus est entretenu sans engrais, fongicides ni pesticides inorganiques, sauf moins de {{ OP4_t0_0 }} des terrains (GRI 101-2). Le projet de rapport d'impact environnemental du plan de gestion de la végétation combustible dresse la liste des espèces menacées et vulnérables aux abords du Hill campus (GRI 101-5)."
    raison: "Longue liste de codes GRI sans contenu, dont GRI 305-2 et GRI 305-3, que le rapport ne peut pas établir ; remplacée par les faits des extraits pour les crédits non traités (flotte, bâtiments, espaces verts, biodiversité)."
    source: "OP-13, ligne 1 ; OP-2, ligne 3 ; OP-4, ligne 1 ; IL-24, ligne 3"
  - avant: "Ce rapport ne peut pas établir les émissions de gaz à effet de serre liées à la chaîne d'approvisionnement, car les données nécessaires n'étaient pas disponibles. De même, ce rapport ne peut pas établir les émissions de gaz à effet de serre liées à la consommation d'énergie, car les données nécessaires n'étaient pas disponibles."
    apres: "Ce rapport ne peut pas établir les émissions indirectes liées à l'énergie (GRI 305-2) ni les autres émissions indirectes, dont celles de la chaîne d'approvisionnement (GRI 305-3) : les valeurs détaillées de STARS n'ont pas été extraites."
    raison: "Ces données existent dans STARS (OP-6) mais n'ont pas été extraites (« Non évalué » dans l'index) ; elles ne sont pas « indisponibles »."
    source: "Index de contenu GRI calculé par le code (esg/gri_index.py)"

social:
  - avant: "Le salaire minimum local est utilisé pour calculer le salaire décent. Le campus composite de la benefits rate pour les membres du personnel est actuellement 42,8 %. Pour qualifier pour un salaire horaire vivable, l'heure devrait être au moins égale à ce taux. L'analyse la plus récente a été menée en 2023."
    apres: "Le salaire décent de référence est calculé avec le calculateur du Massachusetts Institute of Technology (MIT) ; le seuil horaire retenu pour le personnel tient compte du taux composite des avantages sociaux, actuellement de {{ PA13_t1_0 }}. La dernière analyse d'équité salariale, menée en {{ PA13_t0_0 }} sur le personnel de carrière et contractuel (PPSM), compare les rémunérations selon l'origine ethnique, l'identité de genre, l'orientation sexuelle, l'âge et le handicap."
    raison: "Le salaire décent est calculé avec le calculateur du MIT, pas à partir du salaire minimum local (affirmation non confirmée par le juge) ; phrases incompréhensibles (« le campus composite de la benefits rate », « l'heure devrait être au moins égale à ce taux »)."
    source: "PA-13, lignes 1 et 2"
  - avant: "L'université a mis en place des politiques pour protéger les droits des salariés, notamment la lutte contre la discrimination, la protection des lanceurs d'alerte et l'équilibre travail-vie personnelle. Les salariés doivent remplir les conditions pour bénéficier de la politique de congé parental."
    apres: "Le site des ressources humaines de l'université présente les politiques relatives aux droits des salariés : traitement équitable, procédures de réclamation, équilibre entre vie professionnelle et vie personnelle, lutte contre les discriminations, protection des lanceurs d'alerte et avantages sociaux. Pour bénéficier d'un congé familial ou médical, les salariés doivent remplir les conditions de la politique Family and Medical Leave."
    raison: "Affirmation non confirmée par le juge : la source décrit les politiques présentées sur le site des ressources humaines ; il s'agit du congé familial et médical, pas du seul congé parental."
    source: "PA-12, lignes 2 et 3"
  - avant: "L'université propose des ateliers pour promouvoir la santé, la sécurité et le bien-être. Ces ateliers incluent des sessions sur la santé mentale et le bien-être. Le comité de santé et de sécurité au travail est responsable de la mise en œuvre de la politique de santé et de sécurité."
    apres: "L'université propose une série d'ateliers de bien-être (Mind-Body-Spirit Wellness Workshop Series) consacrés à la santé globale : yoga, pleine conscience, écriture et exercices de respiration ; on peut y participer sans suivre toutes les séances."
    raison: "Le « comité de santé et de sécurité au travail » n'apparaît pas dans les extraits ; contenu des ateliers précisé."
    source: "PA-11, ligne 3"
  - avant: "L'université a mis en place des programmes pour promouvoir la parité femmes-hommes, notamment la création d'un centre de ressources sur l'équité des genres et le programme d'encadrement des femmes en sciences, technologie, ingénierie et mathématiques (STEM)."
    apres: "Parmi les programmes de soutien aux femmes figurent le Gender Equity Resource Center (GenEq), le programme Empowering Womxn in STEAM (WiSE) et le programme de mentorat AWE."
    raison: "La source cite des programmes existants, pas leur « création » ; STEAM et non STEM ; le programme AWE manquait."
    source: "PA-6, ligne 2"
  - avant: "L'université a mis en place des initiatives pour promouvoir la représentation ethnique et raciale, notamment la création d'un comité d'équité et d'inclusion et la mise en place de programmes pour soutenir les étudiants issus de minorités.\n\n(GRI 403-6)"
    apres: "La représentation est comparée à la population de l'État de Californie, d'après les données du US Census Bureau (County Population by Characteristics, {{ PA7_t0_0 }}) ; les données sont produites par l'équipe Equity Data Initiatives du service Equity & Inclusion.\n\n(GRI 405-1)"
    raison: "Comité et programmes inventés (rien de tel dans les extraits PA-7) ; GRI 403-6 (santé des travailleurs) ne correspond pas : PA-7 correspond à GRI 405-1."
    source: "PA-7, lignes 1 et 2"
  - avant: "L'université a mis en place des programmes pour promouvoir l'accès et l'accessibilité financière, notamment la création d'un programme de bourses pour les étudiants à faible revenu et la mise en place de programmes pour soutenir les étudiants en difficulté financière.\n\n(GRI 403-4)"
    apres: "Le crédit s'appuie notamment sur la part des étudiants de premier cycle bénéficiant d'une bourse fédérale Pell, d'après l'IPEDS, pour l'année universitaire commençant en {{ PA9_t0_0 }} (la plus récente disponible)."
    raison: "Programmes inventés (les extraits PA-9 ne donnent que la source des données) ; GRI 403-4 (participation des travailleurs à la santé et à la sécurité) ne correspond pas."
    source: "PA-9, ligne 1"
  - avant: "L'université a mis en place des programmes pour promouvoir un climat d'inclusion, notamment la création d'un centre de ressources sur l'équité des genres et le programme d'encadrement des femmes en STEM.\n\n(GRI 403-3)"
    apres: "Le personnel peut rejoindre des organisations fondées sur l'origine ethnique, comme Alianza, Asian Pacific American Systemwide Alliance, Black Staff & Faculty Organization, MENASA et Native & Indigenous Council."
    raison: "Répétition du paragraphe sur la parité ; GRI 403-3 (services de santé au travail) ne correspond pas (PA-6 n'a pas d'équivalent GRI)."
    source: "PA-6, ligne 5"
  - avant: "L'université a mis en place des programmes pour promouvoir la réussite des étudiants, notamment la création d'un centre de ressources pour les étudiants en difficulté et la mise en place de programmes pour soutenir les étudiants à risque.\n\n(GRI 403-2)"
    apres: "Ce rapport ne peut pas établir les actions de l'université pour la réussite étudiante : les extraits STARS de ce crédit ne donnent que la source des données (Office of Planning and Analysis)."
    raison: "Centre et programmes inventés ; GRI 403-2 ne correspond pas (PA-10 n'a pas d'équivalent GRI)."
    source: "PA-10, ligne 1"

enseignement:
  - avant: "L'université de Californie à Berkeley a mis en place divers programmes et dispositifs pour promouvoir l'enseignement, la recherche et l'engagement en matière de durabilité."
    apres: ""
    raison: "Phrase générique, sans fait."
    source: "Aucune (phrase retirée)"
  - avant: "L'université de Californie à Berkeley offre une vaste gamme de cours en durabilité, qui sont classés en fonction de leur contenu et de leur lien avec les objectifs de durabilité. Ces cours sont proposés dans divers domaines, notamment l'environnement, la santé et la justice sociale."
    apres: "L'offre de cours en durabilité a été recensée à partir de l'inventaire des cours de {{ AC1_t9_0 }} à {{ AC1_t9_1 }} : le bureau Planning & Analysis a recherché les mots-clés de durabilité de l'AASHE dans les descriptions du catalogue, puis des étudiants du Bureau de la durabilité ont classé les cours comme axés sur la durabilité ou liés à la durabilité."
    raison: "Phrases génériques ; « environnement, santé et justice sociale » n'est pas dans les extraits."
    source: "AC-1, lignes 2 et 10"
  - avant: "Les programmes de premier cycle de l'université de Californie à Berkeley sont conçus pour donner aux étudiants les compétences et les connaissances nécessaires pour relever les défis de la durabilité. Les étudiants peuvent choisir des cours et des projets qui leur permettent de développer leurs compétences en matière de durabilité."
    apres: "Les diplômes de premier cycle axés sur la durabilité, et ceux qui exigent au moins un cours axé sur la durabilité, sont listés dans le document joint au rapport STARS."
    raison: "Phrases génériques, sans fait ; remplacées par ce que disent les extraits."
    source: "AC-2, lignes 2 et 4"
  - avant: "Les programmes de cycles supérieurs de l'université de Californie à Berkeley offrent aux étudiants la possibilité de poursuivre leurs études en matière de durabilité et de développer des compétences plus avancées. Ces programmes sont conçus pour préparer les étudiants à des carrières dans le domaine de la durabilité."
    apres: "Les programmes de cycles supérieurs axés sur la durabilité, et ceux qui comportent un apprentissage axé sur la durabilité, sont aussi listés dans ce document."
    raison: "Phrases génériques, sans fait ; remplacées par ce que disent les extraits."
    source: "AC-3, lignes 2 et 5"
  - avant: "L'université de Californie à Berkeley soutient la recherche en durabilité à travers diverses partenariats, notamment avec le Laboratoire national de Berkeley. Les chercheurs et les étudiants travaillent ensemble pour développer des solutions innovantes pour les défis de la durabilité."
    apres: "L'université soutient la recherche interdisciplinaire en durabilité par des partenariats, notamment avec le Lawrence Berkeley National Laboratory ; le Berkeley Climate Change Network, par exemple, met en relation chercheurs et étudiants avec des financements et des collaborations sur la durabilité et la résilience. La recherche en durabilité a été repérée par mots-clés dans l'inventaire de la recherche des exercices {{ AC6_t0_0 }} à {{ AC6_t0_1 }}, puis vérifiée par un étudiant du Bureau de la durabilité."
    raison: "Deuxième phrase générique ; nom du laboratoire rétabli ; méthode ajoutée d'après la source."
    source: "AC-6, lignes 1 et 5"
  - avant: "L'université de Californie à Berkeley compte plusieurs centres de recherche en durabilité, qui travaillent ensemble pour promouvoir la durabilité et la responsabilité environnementale. Ces centres sont conçus pour faciliter la collaboration entre les chercheurs et les étudiants."
    apres: "Outre le Berkeley Climate Change Network et le centre de recherche CITRUS, plusieurs centres travaillent sur la durabilité, comme le Sutardja Center for Entrepreneurship and Technology, qui abrite l'Alternative Meats X Lab."
    raison: "Phrases génériques ; remplacées par les centres cités dans la source."
    source: "AC-7, lignes 2 et 6"
  - avant: "L'université de Californie à Berkeley a mis en place diverses initiatives pour sensibiliser les étudiants, le personnel et la communauté à l'importance de la durabilité. Ces initiatives incluent des campagnes de sensibilisation, des événements et des programmes de formation."
    apres: "Le campus a mené plusieurs campagnes de sensibilisation à la durabilité ces dernières années, sur la protection de l'environnement et la justice sociale, notamment par des lettres d'information et des invitations envoyées sur les listes de diffusion de tout le campus."
    raison: "Phrases génériques ; remplacées par les faits de la source."
    source: "EN-1, lignes 14 et 25"
  - avant: "L'université de Californie à Berkeley propose diverses activités parascolaires pour les étudiants, qui leur permettent de développer leurs compétences en matière de durabilité et de participer à des projets de durabilité."
    apres: "Le Student Environmental Resource Center (SERC), service du campus consacré aux activités co-curriculaires des étudiants intéressés par l'environnement, organise chaque semestre de nombreux événements, dont la Climate Justice Week et l'Earth Week, ainsi que le SERC Membership program et le Student Leadership Institute for Climate Resilience."
    raison: "Phrase générique ; remplacée par les faits de la source."
    source: "EN-2, lignes 3 et 14"
  - avant: "L'université de Californie à Berkeley a mis en place des programmes de formation pour le personnel, qui leur permettent de développer leurs compétences en matière de durabilité et de promouvoir la durabilité dans leur travail."
    apres: "Le Bureau de la durabilité a créé une formation à la durabilité pour le personnel (UC Berkeley Sustainability Staff Training), composée de modules que chacun suit à son rythme."
    raison: "Phrase générique ; remplacée par le fait de la source."
    source: "EN-3, ligne 3"
  - avant: "L'université de Californie à Berkeley a mis en place des programmes pour encourager les étudiants et le personnel à participer à des activités de citoyenneté et de service communautaire."
    apres: "Le Public Service Center réunit étudiants, enseignants et communautés au service de la justice sociale et de l'engagement civique, et le Cal Civic Engagement Program encourage les enseignants et le personnel à s'engager par le bénévolat."
    raison: "Phrase générique ; remplacée par les faits de la source."
    source: "EN-5, lignes 1 et 4"
