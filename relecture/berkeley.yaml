# Relecture hors pipeline — rapport de UC Berkeley, section Environnement (6 octobre 2026).
# Corrections proposées par l'assistant Claude Code (IA) à la demande de Wiem Ben Hassine ; à valider par elle.
# Section relue phrase par phrase contre les textes STARS de Berkeley (lignes numérotées comme dans
# facts.csv). Appliqué par le code au rendu (esg/review.py) ; « apres » vide = phrase supprimée.
# Aucun chiffre tapé à la main : {{ ID }} = valeur de facts.csv.

environnement:
  - avant: "Le campus utilise une partie de l'énergie renouvelable via le programme UC Clean Power, qui inclut des sources d'électricité certifiées et non certifiées."
    apres: "Une partie de l'électricité du campus provient du programme UC Clean Power : sa part solaire est déclarée comme électricité renouvelable hors site certifiée, et sa part de grande hydraulique comme électricité renouvelable hors site non certifiée."
    raison: "Imprécis : la source distingue la part solaire (renouvelable certifiée) et la grande hydraulique (renouvelable non certifiée) du programme."
    source: "OP-5, ligne 5 : « the solar portion of UC Clean Power Program's portfolio is reported as … certified off-site renewable … the large hydro portion … uncertified »"
  - avant: "Les émissions de gaz à effet de serre sont compensées par des instruments de retraitement des émissions, issus de projets forestiers américains."
    apres: "Dans le cadre du programme Cap and Trade, des crédits de compensation sont répartis chaque année entre les campus selon leurs émissions ; cette année, les instruments de conformité retirés proviennent de projets forestiers aux États-Unis."
    raison: "Surinterprétation et contresens : les émissions ne sont pas « compensées » dans leur ensemble ; il s'agit de crédits alloués dans le marché Cap and Trade, et « retired » veut dire retirés (annulés), pas « retraitement »."
    source: "OP-6, ligne 3 : « the University allocates offsets according to the total GHG emissions under the Cap and Trade program by campus … the retired offset compliance instruments are from U.S. Forest Projects »"
  - avant: " Le campus a mis en place un système de compostage industriel."
    apres: ""
    raison: "Faux : le campus n'exploite pas de compostage industriel, il envoie ses déchets compostables vers une installation extérieure (voir Matériaux)."
    source: "OP-11, ligne 1"
  - avant: "Le campus a mis en place un système de gestion des matériaux, notamment via l'intégration de la collecte séparée des déchets."
    apres: "Le compostage est intégré à tous les circuits de collecte du campus, et les déchets compostables sont envoyés vers une installation de compostage industriel."
    raison: "« Collecte séparée » n'est pas dans la source, qui parle du compostage intégré à la collecte."
    source: "OP-11, ligne 1 : « UC Berkeley campus has integrated composting into all of our collection systems and its sent to an industrial compost facility »"
  - avant: "Le campus a mis en place un système de réduction des émissions de carbone dans la chaîne d'approvisionnement."
    apres: "Tous les appels d'offres intègrent des critères de durabilité ; l'université évalue ses fournisseurs avec EcoVadis, et ses lignes directrices d'achats durables visent notamment à réduire les émissions et les impacts carbone de la chaîne d'approvisionnement."
    raison: "Surinterprétation : la réduction des émissions de la chaîne d'approvisionnement est un objectif cité, pas un « système mis en place »."
    source: "OP-9, lignes 1, 2 et 4"
  - avant: " Le campus a mis en place des bâtiments répondant aux normes LEED-EBOM."
    apres: ""
    raison: "Mal placé : LEED-EBOM concerne l'exploitation et la maintenance des bâtiments existants (OP-2), pas leur conception (OP-1). Déplacé sous OP-2."
    source: "OP-2, ligne 3"
  - avant: "au crédit OP-2, niveau élevé."
    apres: "au crédit OP-2, niveau élevé. De nombreux bâtiments du campus respectent la norme LEED-EBOM (exploitation et maintenance des bâtiments existants), qui met l'accent sur le nettoyage écologique, les matériaux durables, la qualité de l'air et la réduction des déchets."
    raison: "Suite de la correction précédente : la phrase LEED-EBOM est placée sous le bon crédit, avec le sens donné par la source."
    source: "OP-2, ligne 3 : « Many campus buildings meet LEED-EBOM standards, which emphasize green cleaning practices … sustainable materials, improved air quality, and waste reduction »"
  - avant: "Le campus a mis en place une flotte de véhicules, dont une partie est considérée comme verte."
    apres: "Plus de {{ OP13_t0_0 }} de la flotte du campus est considérée comme verte, véhicules à carburant modulable compris ; les voiturettes électriques non immatriculées ne sont pas comptées dans la flotte."
    raison: "Formulation fausse (« a mis en place une flotte ») et information répétée plus bas ; regroupée ici avec la source."
    source: "OP-13, ligne 1 : « More than 35% of the campus fleet is considered green including our flex-fuel gasoline/E vehicles … electric carts … are not considered part of the fleet »"
  - avant: "Le campus a mis en place une flotte de véhicules, dont plus de 35 % est considérée comme verte."
    apres: ""
    raison: "Répétition de la phrase précédente (même donnée, même formulation fausse)."
    source: "OP-13, ligne 1"
  - avant: "Le campus a mis en place des modes de déplacement durables."
    apres: "La répartition des modes de déplacement provient d'une enquête annuelle sur les transports, diffusée par courriel à tout le campus ou à un échantillon représentatif."
    raison: "Phrase vide de sens et non sourcée ; la source décrit seulement l'enquête qui mesure la répartition modale."
    source: "OP-14, ligne 1 : « Every year the campus conducts a transportation survey on campus that includes determining mode split »"
  - avant: "Le campus a mis en place une évaluation de la biodiversité, notamment via le plan de gestion des feux de végétation."
    apres: "Le projet de rapport d'impact environnemental (Draft EIR) du plan de gestion de la végétation combustible des espaces naturels (Wildland Vegetative Fuel Management Plan) décrit les zones importantes pour la biodiversité."
    raison: "Imprécis : c'est le rapport d'impact environnemental du plan qui décrit les zones importantes pour la biodiversité."
    source: "IL-24, ligne 3 : « UC Berkeley's Draft Environmental Impact Report (Draft EIR) for the Wildland Vegetative Fuel Management Plan contains a description of areas of biodiversity importance »"
