    apres: "Une partie des programmes de premier cycle comporte l'obligation de suivre au moins un cours axé sur la durabilité (liste fournie dans le rapport STARS)."
    raison: "Généralisation : la source renvoie à la liste des programmes concernés, pas à tous les programmes."
    source: "AC-2, ligne 4 (onglet « one sustainability-focused course learning requirement »)"
  - avant: "Les programmes de cycles supérieurs de l'Université de Californie à Berkeley incluent des cours axés sur la durabilité."
    apres: "Une partie des programmes de cycles supérieurs comporte un apprentissage axé sur la durabilité (liste fournie dans le rapport STARS)."
    raison: "Généralisation : la source renvoie à la liste des programmes concernés, pas à tous les programmes."
    source: "AC-3, ligne 5 (onglet « sustainability-focused learning »)"
  - avant: "L'Université de Californie à Berkeley a un centre de recherche en durabilité."
    apres: "Les nouveaux étudiants rencontrent les services liés à la durabilité lors de l'orientation (Golden Bear Orientation), le nouveau personnel reçoit une présentation lors de son accueil, et le campus publie des tableaux de bord (émissions, énergie, eau) et des rapports de durabilité."
