# Relecture hors pipeline — rapport de Technological University Dublin, génération du 7 octobre 2026 (branche rapport-qualite).
# Corrections proposées par l'assistant Claude Code (IA) à la demande de Wiem Ben Hassine ; à valider par elle.
# L'ancienne relecture (texte du 6 octobre) reste dans la branche main. Appliqué par le code au rendu (esg/review.py) ;
# « apres » vide = phrase supprimée. Aucun chiffre tapé à la main : {{ ID }} = valeur de facts.csv.

organisation:
  - avant: "L'université est membre de Technological University Dublin (Irlande) et a soumis"
    apres: "Technological University Dublin (TU Dublin) est une université irlandaise ; elle a soumis"
    raison: "« L'université est membre de Technological University Dublin » n'a pas de sens : c'est l'université elle-même."
    source: "Nom STARS de l'établissement : « Technological University Dublin »"

materialite:
  - avant: "#### Impacts environnementaux\n\nL'université a déclaré que les impacts environnementaux sont matériels pour elle. Elle a identifié les émissions de gaz à effet de serre (GHG) comme étant un thème matériel. L'université a indiqué que ses campus liés à ses objectifs sont réduire les émissions de GHG de 46,5 % et d'ici 2028.\n\n#### Impacts sociaux\n\nL'université a déclaré que les impacts sociaux sont matériels pour elle. Elle a identifié la diversité, l'égalité et l'inclusion (EDI) comme étant un thème matériel. L'université a indiqué que ses campus liés à ses objectifs sont atteindre la certification d'Athena Swan, le plan de lutte contre les discriminations, et mettre fin à la violence sexuelle.\n\n#### Impacts économiques\n\nL'université a déclaré que les impacts économiques sont matériels pour elle. Elle a identifié la durabilité financière comme étant un thème matériel.\n\n#### Impacts sur la gouvernance\n\nL'université a déclaré que les impacts sur la gouvernance sont matériels pour elle. Elle a identifié la gouvernance durable comme étant un thème matériel.\n\n#### Impacts sur la communauté\n\nL'université a déclaré que les impacts sur la communauté sont matériels pour elle. Elle a identifié la durabilité de la communauté comme étant un thème matériel."
    apres: "Ces domaines sont fixés par STARS et sont identiques pour toutes les institutions : STARS ne demande pas à l'université de déclarer ses propres thèmes matériels.\n\n#### Engagement et planification\n\nLe plan stratégique de l'université ({{ PA2_t0_0 }}-{{ PA2_t0_1 }}) fixe des objectifs de durabilité mesurables pour le campus : réduire les émissions de gaz à effet de serre de {{ PA2_t0_2 }} et améliorer l'efficacité énergétique de {{ PA2_t0_4 }} d'ici {{ PA2_t0_3 }}, dans la ligne du Climate Action Plan {{ PA2_t0_6 }}.\n\n#### Égalité, diversité et inclusion\n\nLe même plan comprend un indicateur clé de performance sur la mise en œuvre des plans d'action EDI, avec pour cibles la certification Athena Swan, le plan pour l'égalité raciale (Race Equality Plan) et la fin des violences et du harcèlement sexuels (ESVH). Le plan d'action Athena Swan vise au moins {{ PA2_t1_2 }} de femmes et {{ PA2_t1_3 }} d'hommes à tous les niveaux de décision de la direction."
    raison: "Les cinq « thèmes matériels déclarés » (impacts environnementaux, sociaux, économiques, de gouvernance et sur la communauté) sont inventés : STARS ne contient pas de déclaration de matérialité. « Le plan de lutte contre les discriminations » remplace à tort le Race Equality Plan, et la phrase sur les objectifs du campus était incompréhensible."
    source: "PA-2, lignes 1 et 2"
  - avant: "Ce rapport ne peut pas établir les impacts des activités de l'université sur la communauté locale, car les données disponibles ne permettent pas de le faire."
    apres: "Ce rapport ne peut pas établir, pour chaque thème, les impacts, les actions engagées et le suivi de leur efficacité : STARS ne les décrit qu'en partie (GRI 3-3)."
    raison: "La limite portait sur un thème inventé ; la limite réelle est la gestion des thèmes, partiellement rapportée."
    source: "Index de contenu GRI calculé par le code (GRI 3-3 : partiellement rapporté)"

gouvernance:
  - avant: "L'université est soumise à la gouvernance de la Technological Universities Act 2018. Cette loi impose la représentation des étudiants dans les organes de décision de l'université."
    apres: "La gouvernance de l'université est encadrée par le Technological Universities Act {{ PA3_t0_0 }}, qui impose la représentation des étudiants dans l'organe de gouvernance (Governing Body) ; la présidence de l'Union des étudiants y siège d'office, comme au conseil académique."
    raison: "« Soumise à la gouvernance de la loi » est inexact ; rôle de la présidence de l'Union des étudiants ajouté d'après la source."
    source: "PA-3, ligne 1"
  - avant: "L'université compte également des membres non-académiques dans ses organes de décision, en vertu de la loi 2018. En février 2025, les membres de l'organe de gouvernance comprennent à la fois le personnel non-académique et les membres du personnel académique."
    apres: "Un siège de l'organe de gouvernance est réservé à un membre du personnel non académique (services professionnels), en vertu de la même loi ; la liste des membres du personnel académique et non académique de l'organe en février {{ PA3_t3_1 }} figure dans le rapport STARS."
    raison: "La loi réserve un siège à un membre du personnel non académique ; la deuxième phrase annonçait une composition sans la donner."
    source: "PA-3, ligne 4"

strategie:
  - avant: "L'université Technological University Dublin (TU Dublin) a établi une stratégie de développement durable à travers son plan stratégique"
    apres: "Technological University Dublin (TU Dublin) a inscrit sa stratégie de durabilité dans son plan stratégique"
    raison: "Redondance (« L'université Technological University Dublin »)."
    source: "PA-2, ligne 1"
  - avant: "La TU Dublin a également mis en place des activités de résilience climatique au travers des communautés énergétiques durables (SEC) de la SEAI."
    apres: "Des membres de l'Office de la durabilité participent aussi à des communautés énergétiques durables (SEC) soutenues par la SEAI et voisines du campus de Grangegorman, et mènent avec elles des activités de résilience climatique."
    raison: "Ce ne sont pas des activités « mises en place » par l'université : ses membres participent à des communautés voisines."
    source: "PA-2, lignes 4 à 6"
  - avant: "(par exemple, promotion de transports publics)"
    apres: "(par exemple, interpellations sur les transports publics, demandes de pistes cyclables, réparation gratuite de vélos)"
    raison: "Exemples précisés d'après la source."
    source: "PA-2, ligne 6"
  - avant: "L'université a également mis en place un réseau du personnel et des programmes d'engagement, qui visent à avancer l'intégrité écologique."
    apres: "Parmi les réseaux et programmes d'engagement du personnel « pour l'intégrité écologique », l'école d'architecture de TU Dublin a formé avec toutes les autres écoles d'architecture d'Irlande le partenariat national Building Change, consacré à un enseignement de l'architecture tourné vers un avenir résilient."
    raison: "Phrase vague ; remplacée par l'exemple de la source."
    source: "EN-3, ligne 3"

parties_prenantes:
  - avant: "L'université s'engage dans la gouvernance de l'établissement en mettant en place des représentations étudiantes sur les instances dirigeantes, telles que le Technological Universities Act 2018 le précise."
    apres: "Comme l'impose le Technological Universities Act {{ PA3_t2_0 }}, les étudiants sont représentés dans l'organe de gouvernance de l'université."
    raison: "Formulation confuse."
    source: "PA-3, ligne 3"
  - avant: "De plus, un membre du personnel non-académique (c'est-à-dire un membre du personnel des services professionnels) est réservé à la place sur le Conseil d'administration, comme le précise le TU Act 2018."
    apres: "De plus, un siège de l'organe de gouvernance est réservé à un membre du personnel non académique (services professionnels), comme le prévoit la même loi."
    raison: "Phrase incorrecte (« un membre … est réservé à la place ») ; « Conseil d'administration » au lieu de l'organe de gouvernance."
    source: "PA-3, ligne 4"
  - avant: "(GRI 2-29, Partiellement rapporté)"
    apres: "(GRI 2-29)"
    raison: "Le statut de l'index GRI n'a pas sa place dans le texte (il est donné par l'index calculé par le code)."
    source: "Index de contenu GRI calculé par le code"
  - avant: "comme le TU Dublin St. Vincent de Paul (SVP)."
    apres: "comme la TU Dublin St. Vincent de Paul (SVP) Society, la TU Dublin Environmental Planning Society ou la TU Dublin Enactus Society, soutenue par le GrowthHub de l'université."
    raison: "Exemples complétés d'après la source."
    source: "EN-5, ligne 1"

environnement:
  - avant: "L'université a mis en place plusieurs initiatives pour réduire son impact environnemental.\n\nLa consommation d'énergie de l'université est également réduite grâce à la gestion écologique des espaces verts, qui est décrite dans (GRI 101-2). Cependant, la chaîne de valeur et la hiérarchie d'atténuation ne sont pas complètement rapportées."
    apres: "Des panneaux photovoltaïques sont installés sur le toit de l'atelier de gravure (Printmaking Workshop) ; leur production reste faible, et un projet de géothermie est en cours de développement (GRI 302-1). Les jardins communautaires de Grangegorman et GLAS @ TU Dublin sont entretenus selon des pratiques biologiques (GRI 101-2)."
    raison: "La gestion écologique des espaces verts ne réduit pas la consommation d'énergie (affirmation non confirmée par le juge) ; phrase d'introduction générique."
    source: "OP-5, lignes 1 et 2 ; OP-4, ligne 1"
  - avant: "L'université a également mis en place des systèmes de récupération d'eau, notamment dans le Greenway Hub, où l'eau recyclée est utilisée pour les toilettes."
    apres: "L'eau de pluie est récupérée sur le toit du Greenway Hub, dans les jardins du campus et sur les sites d'horticulture ; au Greenway Hub, elle est filtrée puis utilisée pour les chasses d'eau (GRI 303-1)."
    raison: "Précisé d'après la source (eau de pluie, et non « eau recyclée »)."
    source: "OP-3, ligne 1"
  - avant: "Les fournitures de nettoyage préférées de l'université sont celles qui ont le label Forest Stewardship Council (FSC) ou le label Recycled."
    apres: "Dans les achats, les produits de nettoyage portant le label FSC Recycled sont classés comme préférables (OP-10)."
    raison: "Un seul label (FSC Recycled), et non deux."
    source: "OP-10, ligne 1"
  - avant: "Les bâtiments de l'université sont également conçus pour être énergétiquement efficaces, comme le montre la notation de niveau intermédiaire au crédit OP-1. Les bâtiments existants construits entre 2019 et 2024 ont une notation de niveau A ou supérieur, ce qui signifie qu'ils sont considérés comme Nearly Zero Energy Building (NZEB)."
    apres: "En Irlande, tout bâtiment nouveau ou rénové reçoit un certificat de performance énergétique (Building Energy Rating, BER) délivré sous l'autorité de la SEAI (OP-1). Les bâtiments construits de {{ OP2_t1_0 }} à {{ OP2_t1_1 }} qui ont un BER de classe A sont considérés comme des bâtiments à consommation d'énergie quasi nulle (NZEB)."
    raison: "Un score de niveau intermédiaire ne « montre » pas que les bâtiments sont efficaces ; le BER est expliqué d'après la source."
    source: "OP-1, ligne 1 ; OP-2, ligne 2"
  - avant: "L'université possède également une flotte de véhicules électriques, comme le mentionne la Climate Action Roadmap (Climate-Action-Roadmap-June- 2024 -web.pdf)."
    apres: "Tous les véhicules de l'université sont électriques : ses véhicules diesel ont été remplacés, comme l'indique sa feuille de route climat (Climate Action Roadmap, juin {{ OP13_t0_0 }})."
    raison: "Nom de fichier recopié ; précisé d'après la source."
    source: "OP-13, ligne 1"
  - avant: "Ce rapport ne peut pas établir les émissions directes de GES (champ d'application 1) et les émissions indirectes de GES liées à l'énergie (champ d'application 2) de l'université, car ces informations ne sont pas disponibles. De même, les émissions indirectes de GES (champ d'application 3) et l'intensité des émissions de GES ne sont pas rapportées."
    apres: "Ce rapport ne peut pas établir les émissions de gaz à effet de serre des scopes 1 et 2, celles du scope 3 ni leur intensité (GRI 305-1 à GRI 305-4) : les valeurs détaillées de STARS n'ont pas été extraites."
    raison: "Ces données existent dans STARS (OP-6) mais n'ont pas été extraites (« Non évalué » dans l'index) ; elles ne sont pas « indisponibles »."
    source: "Index de contenu GRI calculé par le code (esg/gri_index.py)"

social:
  - avant: "De plus, TU Dublin estime que tout le monde a le droit à une rémunération juste."
    apres: "TU Dublin vérifie que ses sous-traitants respectent la National Minimum Wage Act {{ PA13_t2_0 }} et la Payment of Wages Act {{ PA13_t2_1 }}, et attend de tous ses fournisseurs qu'ils versent au moins le salaire minimum, ou une juste représentation du salaire en vigueur dans le secteur si elle est plus élevée. Elle a identifié des sous-traitants importants (restauration, nettoyage, maintenance, entretien des espaces verts, services techniques, transport et vente), qui versent tous un salaire décent à leurs employés (GRI 202-1)."
    raison: "Phrase isolée commençant par « De plus » ; les faits de la source sur les sous-traitants, rangés à tort sous « Droits des salariés », sont regroupés ici."
    source: "PA-13, lignes 2 et 3"
  - avant: "#### Droits des salariés\n\nTU Dublin a identifié des sous-traitants importants, notamment ceux fournissant des services de restauration, de nettoyage, de maintenance, de jardinage, de services techniques, de transport et de vente. Tous les sous-traitants paient un salaire de vie décent à leurs employés (GRI 401-1).\n\n"
    apres: ""
    raison: "Ces faits concernent le salaire décent des sous-traitants (PA-13), déplacés dans le paragraphe précédent ; GRI 401-1 (recrutement et rotation du personnel) ne correspond pas."
    source: "PA-13, ligne 2"
  - avant: "TU Dublin soutient les employés qui se déclarent membres de groupes raciaux, ethniques et/ou autochtones marginalisés, par exemple (GRI 405-1)."
    apres: "Le plan d'action Athena Swan de l'université vise au moins {{ PA2_t1_2 }} de femmes et {{ PA2_t1_3 }} d'hommes à tous les niveaux de décision de la direction (GRI 405-1)."
    raison: "Phrase sur l'origine ethnique rangée sous la parité, et coupée (« par exemple » sans exemple) ; remplacée par l'objectif de parité de la source."
    source: "PA-2, ligne 2"
  - avant: "#### Représentation ethnique et raciale\n\nLe « Supportive Environment » KPI a évalué la satisfaction sur des sujets tels que « la fourniture de soutien pour aider les étudiants à réussir académiqument », « l'utilisation des services de soutien à l'apprentissage », « le contact entre les étudiants de différents milieux sociaux, raciaux, ethniques, religieux, d'âge, etc. », « la fourniture d'opportunités pour participer à des activités sociales, etc. » (GRI 403-1).\n\n"
    apres: ""
    raison: "Cet indicateur de satisfaction des étudiants relève du climat institutionnel (PA-6), pas de la représentation ethnique ; il est repris dans le paragraphe « Climat institutionnel ». GRI 403-1 (santé et sécurité au travail) ne correspond pas."
    source: "PA-6, ligne 18"
  - avant: "L'office EDI (égalité, diversité et inclusion) comprend plusieurs initiatives. Grâce à l'EDI, TU Dublin soutient les employés qui se déclarent membres de groupes raciaux, ethniques et/ou autochtones marginalisés, par exemple (GRI 403-1)."
    apres: "L'office de l'égalité, de la diversité et de l'inclusion (EDI) mène plusieurs initiatives pour les employés issus de groupes raciaux, ethniques ou autochtones marginalisés : la direction EDI intègre l'antiracisme dans tous les programmes, avec des ressources, des formations et un accompagnement ; le programme Community Development and Youth Work propose au personnel des ateliers sur l'antiracisme ; des groupes de lecture antiracistes sont ouverts au personnel et aux étudiants ; l'université est partenaire de l'Open Doors Initiative, qui ouvre l'accès à l'emploi aux personnes marginalisées. Un indicateur de satisfaction des étudiants (« Supportive Environment ») porte notamment sur le soutien à la réussite et sur les contacts entre étudiants de milieux différents."
    raison: "Phrase coupée (« par exemple » sans exemple) ; GRI 403-1 ne correspond pas ; exemples de la source ajoutés."
    source: "PA-6, lignes 1 à 4 et 18"
