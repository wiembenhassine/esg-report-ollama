# Relecture hors pipeline — rapport de University College Cork, génération du 7 octobre 2026 (branche rapport-qualite).
# Corrections proposées par l'assistant Claude Code (IA) à la demande de Wiem Ben Hassine ; à valider par elle.
# L'ancienne relecture (texte du 6 octobre) reste dans la branche main. Appliqué par le code au rendu (esg/review.py) ;
# « apres » vide = phrase supprimée. Aucun chiffre tapé à la main : {{ ID }} = valeur de facts.csv.

organisation:
  - avant: "L'université est une organisation à but non lucratif qui est une partie de l'Université nationale d'Irlande."
    apres: "L'université fait partie de la National University of Ireland."
    raison: "« Organisation à but non lucratif » n'apparaît dans aucune source STARS ; seul le rattachement à l'Université nationale d'Irlande ressort du nom officiel."
    source: "Nom STARS de l'établissement : « University College Cork - National University of Ireland, Cork »"
  - avant: "L'université a également mis en place des réunions régulières avec son responsable de la recherche et de l'institution. Ces réunions visaient à présenter des mises à jour régulières sur le processus de collecte de données."
    apres: "Des réunions régulières ont aussi eu lieu avec la fonction « Data and Institutional Research Officer » de l'université, et l'avancement de la collecte des données a été présenté régulièrement au sous-comité de l'équipe de direction sur la durabilité et l'action climatique."
    raison: "Deux informations confondues et une fonction mal traduite : les réunions ont eu lieu avec le Data and Institutional Research Officer ; les points d'avancement étaient présentés au sous-comité de l'équipe de direction (ULT Subcommittee)."
    source: "PRE-4, lignes 2 et 5"

materialite:
  - avant: "Le plan de durabilité et d'action climatique de l'université, établi en 2023, comprend plusieurs objectifs concernant les opérations sur le campus, notamment la réduction des déchets, la gestion des eaux usées et la réduction de l'énergie."
    apres: "Le plan de durabilité et d'action climatique de l'université, qui débute en {{ PA2_t11_0 }}, fixe plusieurs objectifs pour les opérations du campus : dépasser l'objectif national de baisse des émissions de scopes 1 et 2 ({{ PA2_t12_0 }} d'ici {{ PA2_t12_1 }}) et atteindre zéro émission nette d'ici {{ PA2_t12_2 }}, adapter la gestion du patrimoine immobilier au changement climatique, faire du campus un laboratoire vivant de solutions climatiques, protéger les espaces verts et tester de nouvelles façons de réduire et de réutiliser les déchets."
    raison: "Objectifs en partie inventés (« gestion des eaux usées », « réduction de l'énergie ») : le modèle n'avait reçu que la phrase d'introduction de la liste. Voici les objectifs réels."
    source: "PA-2, lignes 12 à 17"
  - avant: "Le plan de durabilité et d'action climatique de l'université, établi en 2023, comprend également des objectifs concernant la réduction des émissions de gaz à effet de serre, la promotion de la mobilité durable et la gestion des ressources naturelles."
    apres: ""
    raison: "Objectifs inventés (« mobilité durable », « gestion des ressources naturelles ») ; les objectifs réels sont dans la phrase précédente corrigée."
    source: "PA-2, lignes 12 à 17"
  - avant: "L'université a également établi un programme de durabilité qui s'aligne sur les stratégies de l'université, notamment la stratégie de l'université en matière de développement durable, de l'égalité, de la diversité et de l'inclusion (EDI), de l'enseignement et de l'apprentissage, et de la recherche."
    apres: "Le plan engage aussi l'université à aligner son programme de durabilité sur ses autres stratégies : engagement communautaire, égalité, diversité et inclusion (EDI), enseignement et apprentissage, et recherche."
    raison: "« Développement durable » remplace à tort « Community Engagement » dans la liste des stratégies ; c'est un engagement du plan, pas un programme déjà « établi »."
    source: "PA-2, ligne 8 : « Align UCC sustainability programme with relevant UCC strategies including Community Engagement, EDI, teaching and learning and research strategies »"

gouvernance:
  - avant: "L'université est gérée par un organe de gouvernance composé de membres du Students Union et d'organisations externes. (GRI 2-9)"
    apres: "Des membres de l'Union des étudiants et des représentants d'organisations externes siègent à l'autorité de gouvernance (Governing Authority), la plus haute instance de décision de l'université. (GRI 2-9)"
    raison: "« Composé de » est trop fort (affirmation non confirmée par le juge) : la source dit que ces personnes y siègent, pas qu'elles composent l'organe."
    source: "PA-3, lignes 3 et 10"
  - avant: "dirigé par la Dr Maria Kirrane, qui coordonne également"
    apres: "dirigé par Dr Maria Kirrane (Head of Sustainability and Climate Action), qui coordonne également"
    raison: "Fonction précisée d'après la source ; « la Dr » suppose un genre que la source ne donne pas."
    source: "PA-1, lignes 5 et 6"
  - avant: "L'université a également mis en place un programme d'investissement durable, dans lequel elle a signé l'engagement du PRI (Principles for Responsible Investment) de l'ONU. (PA-4)"
    apres: "L'université est signataire des Principes pour l'investissement responsable des Nations unies (UN PRI) : elle s'est engagée à intégrer les questions ESG dans l'analyse et les décisions d'investissement et dans ses pratiques d'actionnaire, et son gestionnaire d'actifs réduit progressivement les placements dans les énergies fossiles. (PA-4)"
    raison: "Le nom du crédit et l'engagement PRI étaient mélangés ; précisé d'après la source."
    source: "PA-4, lignes 2 et 4"
  - avant: "au crédit PA-4, niveau élevé Programme d'investissement durable (Sustainable Investment Program), niveau élevé."
    apres: "au crédit PA-4 (programme d'investissement durable), niveau élevé."
    raison: "Libellé du crédit recopié après le score, avec le niveau répété."
    source: "Libellé du crédit PA-4 (mapping/credits_fr.yaml)"
  - avant: "Ce rapport ne peut pas établir si les responsables de la gestion des impacts rendent compte à l'organe de gouvernance."
    apres: "Ce rapport ne peut pas établir si les responsables de la gestion des impacts rendent compte à l'organe de gouvernance, ni la plupart des informations des publications GRI 2-10 à GRI 2-21 (nomination, présidence, rémunération…), que STARS ne collecte pas ou seulement en partie (GRI 2-13)."
    raison: "Limite incomplète (violation relevée par le juge) : les publications GRI 2-10 à 2-21 sont non rapportées, sauf GRI 2-13, partiellement."
    source: "Index de contenu GRI calculé par le code (esg/gri_index.py)"

strategie:
  - avant: "L'université s'appuie sur sa Stratégie de développement durable et son Plan d'action pour la durabilité et le climat pour guider ses actions en matière de durabilité."
    apres: "Le plan de durabilité et d'action climatique de l'université ({{ PA2_t0_0 }}-{{ PA2_t0_1 }}) prolonge sa stratégie de durabilité de {{ PA2_t0_2 }} et guide ses actions en matière de durabilité."
    raison: "La stratégie de durabilité est l'ancien document (de 2016) sur lequel s'appuie le plan actuel ; ce n'est pas une « Stratégie de développement durable » en vigueur à côté du plan."
    source: "PA-2, ligne 1 : « The Sustainability and Climate Action Plan (2023-2028) builds on the successes of UCC's Sustainability Strategy (2016) »"
  - avant: "Cette stratégie vise à aligner les objectifs de durabilité de l'université avec ses stratégies pertinentes"
    apres: "Ce plan engage l'université à aligner son programme de durabilité sur ses autres stratégies"
    raison: "C'est le plan de durabilité et d'action climatique, et non l'ancienne stratégie de durabilité, qui prévoit cet alignement."
    source: "PA-2, ligne 18"
  - avant: "L'université compte un organisme de gouvernance, l'Office de la durabilité et de l'action climatique, qui coordonne les efforts de durabilité de l'université. Ce dernier est soutenu par le Plan d'action pour la durabilité et le climat et bénéficie de la consultation étendue avec le personnel et les étudiants (GRI 2-23)."
    apres: "L'Office de la durabilité et de l'action climatique, rattaché au bureau de la présidence, coordonne les actions de durabilité de l'université ; il s'appuie sur le plan de durabilité et d'action climatique, élaboré après une large consultation du personnel et des étudiants (GRI 2-23)."
    raison: "L'office n'est pas un « organisme de gouvernance » ; c'est le plan qui a été élaboré après consultation."
    source: "PA-1, ligne 1 : « The Office of Sustainability and Climate Action sits within the President's Office … This plan was developed following extensive consultation with staff and students »"
  - avant: "comme en témoigne la présence de considérations de durabilité dans 21 % des appels d'offres, et 54 % des appels d'offres comprennent des spécifications de durabilité pour les fournisseurs et des conditions de durabilité pour les produits (GRI 2-28)."
    apres: "par exemple en {{ OP9_t0_0 }}, {{ OP9_t0_1 }} des appels d'offres comportaient des spécifications de durabilité pour les fournisseurs et {{ OP9_t0_2 }} des conditions de durabilité pour les produits (GRI 2-28)."
    raison: "Pourcentages mal rattachés : 21 % concerne les spécifications pour les fournisseurs et 54 % les conditions pour les produits."
    source: "OP-9, ligne 1 : « 21% of tenders included supplier sustainability specifications and 54% of tenders included product sustainability considerations »"
  - avant: "En outre, l'université a mis en place un système de formation et d'engagement du personnel pour favoriser la durabilité, comme le cours de formation sur le leadership climatique développé en collaboration avec l'Institut de la durabilité et l'Académie de la durabilité (GRI 2-25)."
    apres: "En {{ EN3_t2_0 }}, l'Office de la durabilité et de l'action climatique a créé, avec le Sustainability Institute and Academy, une formation au leadership climatique suivie par toute l'équipe de direction de l'université (GRI 2-25)."
    raison: "« Système de formation et d'engagement du personnel » est vague ; précisé d'après la source."
    source: "EN-3, ligne 3"

parties_prenantes:
  - avant: "De plus, les non-académiques peuvent participer à la gouvernance de l'institution par le biais de diverses voies, notamment par l'intermédiaire de leur union professionnelle et de divers comités de direction (GRI 2-29)."
    apres: "Le personnel non académique peut aussi participer à la gouvernance, notamment par le syndicat du personnel et par les sous-comités de l'équipe de direction, qui comptent tous des représentants de ce personnel (GRI 2-29)."
    raison: "Formulation imprécise (« les non-académiques », « union professionnelle », « comités de direction »)."
    source: "PA-3, ligne 7"
  - avant: "L'université encourage également l'engagement civique de ses étudiants, notamment par le biais du programme UNIC, qui vise à renforcer les collaborations entre les universités et les municipalités pour atteindre l'action climatique en ville (GRI 2-29)."
    apres: "Dans le cadre du programme UNIC, l'université a créé l'Urban Climate Collab, un projet de recherche sur les collaborations entre universités et municipalités pour l'action climatique dans les villes (GRI 2-29)."
    raison: "UNIC n'est pas un programme d'engagement civique des étudiants : c'est le cadre dans lequel UCC a créé l'Urban Climate Collab, un projet de recherche."
    source: "EN-5, ligne 4"
  - avant: "Les étudiants sont également encouragés à consacrer un temps minimum à une organisation communautaire et à rédiger un rapport de réflexion (GRI 2-29)."
    apres: "Pour le bénévolat suivi en ligne, les étudiants doivent consacrer un nombre minimum d'heures à une organisation communautaire et rédiger un rapport de réflexion (GRI 2-29)."
    raison: "« Encouragés » au lieu de « required » : c'est une obligation de ce dispositif de bénévolat."
    source: "EN-5, ligne 1 : « Students are required to dedicate a minimum of … hours of their time to a community based organisation »"
  - avant: "Enfin, l'université respecte les droits des salariés, notamment le droit à la liberté d'association (GRI 2-29)."
    apres: "Enfin, la liberté d'association est rappelée comme un droit fondamental garanti par la Constitution irlandaise (GRI 2-29)."
    raison: "Généralisation : la source rappelle la liberté d'association, sans affirmer que l'université « respecte les droits des salariés »."
    source: "PA-12, ligne 4"

environnement:
  - avant: "L'université a mis en place plusieurs mesures pour réduire son impact environnemental. La consommation d'énergie de l'université est évaluée en fonction de ses émissions de gaz à effet de serre (GRI 305-1)."
    apres: "L'université a électrifié son matériel d'entretien des espaces verts (tondeuses, débroussailleuses) et met une petite flotte de vélos électriques à la disposition du personnel technique (OP-13). Ses émissions de gaz à effet de serre sont calculées par le prestataire Sustineo selon le GHG Protocol et la norme ISO 14064-1, d'abord à partir des dépenses, puis à partir de données primaires (GRI 305-1)."
    raison: "Une phrase générique et une phrase fausse (l'énergie n'est pas « évaluée en fonction des émissions ») ; remplacées par des faits des extraits fournis au modèle."
    source: "OP-13, ligne 2 ; OP-6, ligne 1"
  - avant: "L'université a également mis en place des systèmes d'approvisionnement durables (GRI 308-1)."
    apres: "En {{ OP9_t0_0 }}, {{ OP9_t0_1 }} des appels d'offres comportaient des spécifications de durabilité pour les fournisseurs et {{ OP9_t0_2 }} des conditions de durabilité pour les produits ; en moyenne, {{ OP9_t1_0 }} des points d'évaluation portent sur la durabilité (GRI 308-1)."
    raison: "Phrase générique ; remplacée par les faits de la source."
    source: "OP-9, lignes 1 et 2"
  - avant: "En ce qui concerne la gestion des déchets, l'université a mis en place des programmes de recyclage et de valorisation des déchets (GRI 306-2)."
    apres: "Les données sur les déchets non dangereux sont collectées par le prestataire Panda ; l'université participe au programme national de recyclage des équipements électriques et électroniques (WEEE), avec des bacs sur le campus et des bacs à piles à la bibliothèque (GRI 306-2)."
    raison: "Phrase générique ; remplacée par les faits de la source."
    source: "OP-12, ligne 1 ; OP-11, ligne 6"
  - avant: "au crédit OP-12, niveau élevé Production et valorisation des déchets (Waste Generation and Recovery), niveau élevé."
    apres: "au crédit OP-12 (production et valorisation des déchets), niveau élevé."
    raison: "Libellé du crédit recopié après le score, avec le niveau répété."
    source: "Libellé du crédit OP-12 (mapping/credits_fr.yaml)"
  - avant: "L'université a également mis en place des mesures pour réduire sa consommation d'eau (GRI 303-1)."
    apres: "Le bâtiment Beaufort récupère l'eau de pluie, et dans le bâtiment Western Gateway, l'eau rejetée par la pompe à chaleur géothermique remplit les réservoirs des chasses d'eau (GRI 303-1)."
    raison: "Phrase générique ; remplacée par les faits de la source."
    source: "OP-3, lignes 1 et 2"
  - avant: "Enfin, l'université a mis en place des mesures pour réduire ses émissions de gaz à effet de serre (GRI 305-5)."
    apres: "Une partie de l'électricité de l'université est d'origine éolienne, fournie par son fournisseur d'énergie sous contrat (GRI 302-1)."
    raison: "Mauvais rattachement : la phrase suivante donne le score de l'énergie (OP-5), pas de la réduction des émissions ; remplacée par le fait de la source OP-5."
    source: "OP-5, ligne 2"
  - avant: "Ce rapport ne peut pas établir les émissions de gaz à effet de serre liées à l'énergie (GRI 305-2) ou les émissions indirectes de gaz à effet de serre (GRI 305-3) de l'université, car ces informations ne sont pas disponibles. De même, le rapport ne peut pas établir les impacts de l'université sur la biodiversité (GRI 101-2, GRI 101-4, GRI 101-5), car ces informations ne sont pas disponibles."
    apres: "Ce rapport ne peut pas établir les émissions de gaz à effet de serre liées à l'énergie (GRI 305-2) ni les autres émissions indirectes (GRI 305-3) : les valeurs détaillées de STARS n'ont pas été extraites. Les impacts sur la biodiversité (GRI 101-2, GRI 101-4, GRI 101-5) ne sont couverts qu'en partie : l'évaluation de la biodiversité du campus identifie les habitats et les espèces et comprend un plan d'action pour leur gestion (IL-24)."
    raison: "Limites inexactes : GRI 305-2 et 305-3 sont « Non évalué » (valeurs non extraites, pas absentes) ; GRI 101-2, 101-4 et 101-5 sont « Partiellement rapporté » grâce à l'évaluation de la biodiversité."
    source: "Index de contenu GRI calculé par le code ; IL-24, lignes 1 et 3"

